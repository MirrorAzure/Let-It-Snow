<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Let It Snow — OBS overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    #lis-obs-status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 2147483647;
      padding: 6px 10px;
      border-radius: 8px;
      font: 600 13px/1.3 system-ui, sans-serif;
      color: #fff;
      background: rgba(20, 30, 45, 0.72);
      pointer-events: none;
    }
    #lis-obs-status[hidden] { display: none; }
  </style>
  <script src="./overlay.js" defer></script>
</head>
<body>
  <div id="lis-obs-status" hidden></div>
</body>
</html>
