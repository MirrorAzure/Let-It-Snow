name: build-extensions

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package version v${VERSION}." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches package version v${VERSION}"

      - name: Build all targets
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: builds
          path: |
            builds/**
            dist/**

      - name: Upload release packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-extensions
          path: builds/**

  # Standalone relay (Node single executable + OBS script). SEA cannot cross-compile,
  # so every platform is built on its own runner.
  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build standalone relay
        run: pnpm build:relay

      - name: Upload relay package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-relay-${{ matrix.os }}
          path: builds/let-it-snow-relay-*.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
            echo "changelog<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=First release" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            release-assets/**
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
